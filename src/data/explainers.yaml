# Explainers, one block per piece.
#
# This file is the single place an explainer is declared. It owns the title and
# the blurb, and it is what puts the piece on /explainers/.
#
# A body comes in one of three flavours, and at most one field may say which.
#
#   body: something.md   Prose, served at /explainers/<slug>/. Write
#                        src/content/explainers/something.md and put nothing in
#                        it but the writing — no frontmatter is needed, since
#                        the title and blurb are already here. Optional
#                        `updated: 2026-08-02` shows a date under the title.
#
#   url: https://...     A piece that lives somewhere else. Nothing is built;
#                        every link to it points offsite.
#
#   neither              A hand-built page at src/pages/explainers/<slug>.astro,
#                        for anything prose cannot carry: charts, tables,
#                        interactive figures. Wrap its content in
#                        <div class="explainer"> and import
#                        src/styles/explainer.css for the shared furniture.
#
# `papers` is optional. List paper ids and each of those papers gets an
# "Explainer" chip on /research/ pointing here; an id matching no paper fails
# the build. Leave it out for a piece that belongs to no paper.

- slug: rent-control
  title: "Rent control: the ceiling trap"
  description: >-
    Why the most popular idea in housing policy keeps failing the people it is
    meant to help.
  url: https://mason.gmu.edu/~atabarro/RentControl/

- slug: refund-bonuses
  title: The refund bonus
  description: >-
    How dominant assurance contracts and refund bonuses solve the free-rider
    problem, and what the experimental evidence shows.
  papers:
    - the-private-provision-of-public-goods-via-dominant
    - early-refund-bonuses-increase-successful-crowdfunding
    - signaling-quality-how-refund-bonuses-can-overcome-information
    - breaking-ground-can-refund-bonuses-solve-the-holdout
