- id: irrelevance-propositions-are-irrelevant
  title: "Irrelevance Propositions Are Irrelevant"
  url: https://doi.org/10.1111/j.1467-6435.1995.tb02322.x
  year: 1995
  comment: >-
    Pascal's Wager applied to new-classical economics.
  abstract: >-
    Abstract: Ricardian equivalence theory and other New-Classical neutrality results have
    generated an enormous debate because they appear to have strong implications for policy. I
    argue that irrelevance propositions are policy irrelevant. If these propositions are true
    then behaving as if they are false has zero costs, but, if they are false, behaving as if
    they are true may be very costly. Thus, even if we beleive these propositions to be true, we
    should behave as if they were false. In consequence, we should not be overly concerned with
    whether these propositions are in fact true. An interesting corrolary of the above arguments
    is that if irrelevance propositions are believed to be true much evidence will exist which
    suggests that they are false.
  citation: >-
    Tabarrok, A. 1995. Irrelevance Propositions Are Irrelevant. Kyklos 48:409-417.

- id: good-grapes-and-bad-lobsters-applying-the-alchian
  title: "Good Grapes and Bad Lobsters: Applying the Alchian and Allen Theorem"
  url: https://doi.org/10.1111/j.1465-7295.1995.tb01860.x
  year: 1995
  abstract: >-
    Abstract: We consider the well-known theorem of Alchian and Allen that adding a per unit
    charge to the price of two substitute goods increases the relative consumption of the higher
    price good. The current literature misspecifies the conditions under which the theorem
    holds. When applying the theorem the fixed cost should be applied on a per unit basis,
    rather than in terms of an entry fee for consumption. We state the necessary conditions for
    the theorem to hold when the the consumers are shipped to the goods.
  citation: >-
    Cowen, T., and A. Tabarrok. 1995. Good Grapes and Bad Lobsters: Applying the Alchian and
    Allen Theorem. Economic Inquiry XXXIII (April):253-56.

- id: genetic-testing-an-economic-and-contractarian-analysis
  title: "Genetic Testing: An Economic and Contractarian Analysis"
  url: http://www.sciencedirect.com/science?_ob=MImg&_imagekey=B6V8K-45DMNXW-G-1&_cdi=5873&_orig=browse&_coverDate=03%2F31%2F1994&_sk=999869998&wchp=dGLbVtb-lSzBS&_acct=C000035118&_version=1&_userid=650615&md5=651b9a2c5468780131fc578adcb7381e&ie=f.pdf
  year: 1994
  abstract: >-
    ABSTRACT: Medical researchers are rapidly identifying the genetic causes of many diseases.
    Genes that increase the risk of contracting Alzheimer's, colon and breast cancer,
    Huntington's, cystic fibrosis and numerous other diseases have been identified. Genetic
    tests can reveal an individual's probable health status many years in advance of sickness.
    Many fear that this will lead to `genetic discrimination' in the employment and health
    insurance markets. Solutions such as consent laws are impractical and create adverse
    selection problems. A new form of insurance, genetic insurance, can eliminate these problems
    and allow everyone to be insured.
  citation: >-
    Tabarrok, A. 1994. Genetic Testing: An Economic and Contractarian Analysis. Journal of
    Health Economics 13:75-91.

