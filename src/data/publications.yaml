- id: the-private-provision-of-public-goods-via-dominant
  title: "The Private Provision of Public Goods Via Dominant Assurance Contracts"
  url: https://mason.gmu.edu/~atabarro/PrivateProvision.pdf
  year: 1998
  comment: >-
    My most un(der)appreciated paper!
  abstract: >-
    ABSTRACT: Many types of public goods can be produced privately by profit seeking
    entrepreneurs using a modified form of assurance contract, called a dominant assurance
    contract. I model the dominant assurance contract as a game and show that the pure strategy
    equilibrium has agents contributing to the public good as a dominant strategy. The game is
    also modelled under incomplete information as a Bayesian-Nash game.
  citation: >-
    Tabarrok, A. 1998. The Private Provision of Public Goods Via Dominant Assurance Contracts.
    Public Choice 96:345-362.

