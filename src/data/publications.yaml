- id: president-perot-or-fundamentals-of-voting-theory-illustrated
  title: "President Perot, or Fundamentals of Voting Theory Illustrated with the 1992 Election"
  url: https://mason.gmu.edu/~atabarro/Perot.pdf
  year: 2001
  comment: >-
    Mathematica code for most of the calculations in this paper can be found here. This paper
    uses the same techniques (but in one less dimension) as Would the Borda Count have Avoided
    the Civil War? - thus the theory sections overlap.
  abstract: >-
    ABSTRACT: Different voting systems can lead to different election outcomes even when voter
    preferences are held constant. Using the 1992 election as an example, it is shown how the
    outcome of every positional vote system can be found. Similarly, every possible cumulative
    and approval vote outcome is shown. Multiple vote systems, like approval and cumulative
    voting, have disturbing properties. Using the 1992 election as illustration, it is shown how
    a candidate who wins under every positional vote system, who wins every pairwise vote (i.e.
    is the Condorcet winner), and who has the most first place and least last place votes may
    nevertheless lose under approval or cumulative voting. Similarly, it is shown how a
    candidate who loses under every positional system, who loses every pairwise vote (i.e. is
    the Condorcet loser), and who has the least first place and most last place votes may
    nevertheless win under approval or cumulative voting.
  citation: >-
    Tabarrok, Alexander. 2001. President Perot, or Fundamentals of Voting Theory Illustrated
    with the 1992 Election. Public Choice 106 (3-4): 275-297.

- id: an-economic-theory-of-avant-garde-and-popular
  title: "An Economic Theory of Avant-Garde and Popular Art, or High and Low Culture"
  url: http://links.jstor.org/sici?sici=0038-4038%28200010%2967%3A2%3C232%3AAETOAA%3E2.0.CO%3B2-X
  year: 2000
  abstract: >-
    (The above is a link to the JSTOR PDF. [Email me](mailto:Alex.Tabarrok@gmail.com) if you do
    not have access.) ABSTRACT: Artists face choices between the pecuniary benefits of selling
    to the market and the non-pecuniary benefits of creating to please their own tastes. We
    examine how changes in wages, lump sum income, and capital-labor ratios affect the artist's
    pursuit of self-satisfaction versus market sales. Using our model of labor supply as a
    guide, we consider the economic forces behind the high/low culture split, why some artistic
    media offer greater scope for the avant-garde than others, why so many artists dislike the
    market, and how economic growth and taxation affect the quantity and form of different kinds
    of art.
  citation: >-
    Cowen, Tyler and Alexander Tabarrok. 2000. An Economic Theory of Avant-Garde and Popular
    Art, or High and Low Culture. Southern Economic Journal 67(2): 232-253.

- id: assessing-the-fda-via-the-anomaly-of-off
  title: "Assessing the FDA via the Anomaly of Off-Label Drug Prescriptions"
  url: http://www.independent.org/publications/tir/article.asp?issueID=21&articleID=240
  year: 2000
  abstract: >-
    ABSTRACT: Most American hospital patients are given drugs not approved by the U.S. Food and
    Drug Administration for the prescribed use. If off-label prescribing is so widespread and
    successful, is the FDA's pre-approval process really necessary?
  citation: >-
    Tabarrok, A. 2000. Assessing the FDA via the Anomaly of Off-Label Drug Prescriptions. The
    Independent Review V, #1: pp. 25-53.

- id: runaway-judges-selection-effects-and-the-jury
  title: "Runaway Judges? Selection effects and the jury?"
  url: https://mason.gmu.edu/~atabarro/JudgeJuryFinal
  year: 2000
  abstract: >-
    ABSTRACT: Reports about runaway jury awards have become so common that it is widely accepted
    that the US jury system needs to be ‘fixed.’ Proposals to limit the right to a jury trial
    and increase judicial discretion over awards implicitly assume that judges decide cases
    differently than juries. We show that there are large differences in mean awards and win
    rates across juries and judges. But if the types of cases coming before juries are different
    from those coming before judges, mean award and win rates may differ even if judges and
    juries would make the same decisions when faced with the same cases. We find that most of
    the difference in judge and jury mean awards can be explained by differences in the sample
    of cases coming before judges and juries. On some dimensions, however, there remain robust
    and suggestive differences between judges and juries.
  citation: >-
    Helland, Eric and Alexander Tabarrok. 2000. Runaway Judges? Selection effects and the jury?
    Journal of Law, Economics, and Organization 16 (2): 306-333.

- id: believe-in-pascals-wager-have-i-got-a
  title: "Believe in Pascal's Wager? Have I got a deal for you!"
  url: https://mason.gmu.edu/~atabarro/Pascal%27sWager.pdf
  year: 2000
  abstract: >-
    ABSTRACT: Pascal’s wager is initially compelling because “believing” in God appears to be
    costless. Believing in the possibility of infinite utility, however, implies that the
    believer is willing to accept any finite cost to achieve any positive probability, no matter
    how small, of attaining infinite utility. "Tabarrok's offer," although costly, should be
    compelling to those who accept Pascal's wager.
  citation: >-
    Tabarrok, A. 2000. Believe in Pascal's Wager? Have I got a deal for you! Theory and Decision
    48: 123-128.

- id: the-ramsey-model-of-economic-growth
  title: "The Ramsey Model of Economic Growth"
  url: https://mason.gmu.edu/~atabarro/RamseyGrowthModel.nb
  year: 2000
  comment: >-
    The link is to a Mathematica NB file.
  abstract: >-
    ABSTRACT: The Ramsey model of economic growth is a workhorse of contemporary
    macro-economics. It's the starting point not only for growth theory but also for modern
    business cycle theory. Ask an economist how the economy will react to an increase in
    government purchases or to a change in the tax rate on capital and the first model he will
    reach for in a search for answers is the Ramsey model. In this paper I briefly explain a
    simple version of the Ramsey model and put the model through its paces using Mathematica's
    extensive numerical and graphical abilities.
  citation: >-
    Tabarrok, Alexander. 2000. The Ramsey Model of Economic Growth. Mathematica in Education and
    Research 8: 3-4: 43-51.

- id: the-opportunity-costs-of-rent-seeking
  title: "The Opportunity Costs of Rent Seeking"
  url: https://mason.gmu.edu/~atabarro/TheOpportunityCostsofRentSeeking.pdf
  year: 1999
  comment: >-
    May be minor differences from published version.
  abstract: >-
    ABSTRACT: The costs of rent seeking exceed traditional measures when opportunity cost is
    considered. When the quantity of resources consumed by rent seeking is large, rent seeking
    draws consumer surplus out of alternative resource employments. The costs of rent seeking
    differ in partial and general equilibrium frameworks; Tullock (1989) recognizes this but
    incorrectly argues that rent seeking costs are twice as large in general than in partial
    equilibrium. Other authors suggest that rent seeking costs are lower once the opportunity
    costs of resources used in rent seeking are considered. We clear up the confusion in the
    current literature.
  citation: >-
    Cowen, T., and A. Tabarrok. 1999. The Opportunity Costs of Rent Seeking. Journal of Public
    Finance and Public Choice XVII (2-3):121-27.

- id: court-politics-the-political-economy-of-tort-awards
  title: "Court Politics: The Political Economy of Tort Awards"
  url: null
  year: 1999
  comment: >-
    In most respects superseded by The Effect of Electoral Institutions on Tort Awards which
    reviews the pertinent findings from this paper.
  abstract: >-
    ABSTRACT: We investigate the forces, which explain why trial awards differ across the U.S.
    states. In 23 states judges are elected and in 10 they are elected via partisan elections.
    Elections have two important effects. First, defendants are often out-of-state non-voters
    while plaintiffs are typically in-state voters. We predict, therefore, that elected judges
    will redistribute wealth from out-of-state businesses to in-state plaintiffs. Second, the
    realities of campaign financing require judges to seek and accept campaign funding from
    trial lawyers who uniformly are interested in larger awards. We hypothesize that these two
    forces cause awards to be larger in states where the judiciary is elected rather than
    appointed. We also hypothesize that the demand for redistribution will increase as poverty
    increases and thus that awards will be larger in states with greater poverty. Using a sample
    of over 7000 cases across 48 of the 50 states we find significant evidence in support of
    these hypotheses.
  citation: >-
    Tabarrok, A., and E. Helland. 1999. Court Politics: The Political Economy of Tort Awards.
    Journal of Law and Economics XLII,1(April): 157-188.

- id: would-the-borda-count-have-avoided-the-civil
  title: "Would the Borda Count have Avoided the Civil War?"
  url: https://mason.gmu.edu/~atabarro/Would%20the%20Borda%20Count.pdf
  year: 1999
  comment: >-
    Mathematica code for most of the calculations in this paper can be found here. This paper
    uses the same techniques (but in one more dimension) as President Perot - thus the theory
    sections overlap.
  abstract: >-
    ABSTRACT: The election of 1860 was one of the most important and contentious elections in US
    history. It was also one of the most interesting. Four candidates from three different
    parties battled for the presidency and all four received a significant number of votes. We
    ask whether Lincoln's victory was sound, or was it due to a fluke in the electoral system?
    Did a Lincoln win plausibly represent the will of the voters or would a different voting
    system have represented their preferences more accurately? Would the outcome have been the
    same had one or more of the candidates dropped out of the race? These and other questions
    are answered using new graphical techniques which let us assess voter preferences more
    accurately. Using these techniques, we are able to show, in a single figure, the outcome of
    every positional voting system, as well as all possible approval voting outcomes. By
    comparing the outcome under plurality rule to the outcomes which would have occurred under
    other voting systems, we conclude that Stephen Douglas, not Lincoln, was plausibly the
    candidate who best represented the preferences of the voters.
  citation: >-
    Tabarrok, Alexander. and Lee Spector. 1999. Would the Borda Count have Avoided the Civil
    War? Journal of Theoretical Politics 11(2): 261-288.

- id: voting-theory-with-representation-triangles-and-cubes
  title: "Voting Theory with Representation Triangles and Cubes"
  url: https://mason.gmu.edu/~atabarro/VotingArticle.nb
  year: 1998
  comment: >-
    The link is to a Mathematica NB file. See the material on voting and mathematica for more
    complete coverage of the voting package.
  abstract: >-
    Abstract: Voting seems straightforward but on closer inspection even simple voting rules
    have mysterious and odd properties which often challenge our conception of democracy. Some
    of these paradoxes have bothered social scientists for hundreds of years but until recently
    little theory existed which explained why and when paradoxes might be expected to occur. In
    his book, "The Geometry of Voting," the mathematician Donald Saari has shed considerable
    light on why voting 'paradoxes' occur and how they can be predicted. The package voting.m
    uses Mathematica's capabilities to implement many of the functions described in Saari's book
    "The Geometry of Voting," Springer-Verlag, 1994. The package allows us to experiment with
    positional voting systems, pairwise voting, approval voting and cumulative voting. In this
    article I will focus on positional and pairwise voting, other package capabilities are
    explained at length in the electronic supplement.
  citation: >-
    Tabarrok, A. 1998. Voting Theory with Representation Triangles and Cubes. Mathematica in
    Education and Research 7 (3):20-28.

- id: who-benefits-from-progress
  title: "Who Benefits from Progress?"
  url: https://doi.org/10.1111/j.1467-6435.1998.tb01426.x
  year: 1998
  abstract: >-
    Abstract: Progress is better for some consumers than for others. We analyze the factors
    which govern how much a consumer gains from progress, defined as price declines and the
    introduction of new and improved products, and we show how these factors vary systematically
    across different consumer groups. Economic developments of the 1980s and 1990s have brought
    increasing disagreement about the performance of the American and European economies.
    Economists typically try to account for these dual and contrasting perspectives by citing
    the increasing gap between the wages of skilled and unskilled labor. We examine differential
    consumer gains as another factor which may account for the contrasting perspectives.
    Differential consumer gains can also help to explain contrasting perspectives on the
    de-socialization of the East European and Soviet economies.
  citation: >-
    Tabarrok, Alexander and Tyler Cowen. 1998. Who Benefits from Progress?, Kyklos 51
    (3):379-397.

- id: the-separation-of-commercial-and-investment-banking-morgans
  title: "The Separation of Commercial and Investment Banking: Morgans Vs Rockefellers"
  url: http://www.qjae.org/journals/qjae/pdf/qjae1_1_1.pdf
  year: 1998
  comment: >-
    Too much public choice takes a correlation as proof of (special interest) causation. This
    paper is my attempt at an historical public choice. My most Rothbardian paper.
  abstract: >-
    ABSTRACT: The public interest arguments for the separation of commercial and investment
    banking are weak and appear unable to explain the passage of the Banking Act. The separation
    can best be understood in the context of a bank war between the Morgan and Rockefeller
    banking groups. The House of Morgan blended commercial and investment banking to a much
    greater extent than did the Rockefeller group. Although separation raised the costs of
    banking to the Rockefeller group, it hurt the House of Morgan disproportionately and gave
    the Rockefeller group a decisive advantage in their battle with the Morgans. The
    micro-history approach of this paper pinpoints the specific individuals who were responsible
    for the Act's provisions separating commercial and investment banking.
  citation: >-
    Tabarrok, A. 1998. The Separation of Commercial and Investment Banking: Morgans Vs
    Rockefellers. The Quarterly Journal of Austrian Economics 1 (1):1-18.

