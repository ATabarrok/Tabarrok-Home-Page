- id: the-preferred-tax-type-comment-on-herbener
  title: "The Preferred Tax Type: Comment On Herbener"
  url: http://www.qjae.org/journals/rae/pdf/rae5_2_5.pdf
  year: 1991
  abstract: >-
    Abstract: "Austrian" economists sometimes object that indifference curves are a poor tool
    because indifference doesn't exist in the real world. The premise is questionable but the
    real issue is, Does the use of i. curves results in mistaken economics? Herbener was the
    first to try to proof that it does but his argument is faulty.
  citation: >-
    Tabarrok, A. 1991. The Preferred Tax Type: Comment On Herbener. Review of Austrian Economics
    5 (2):107-10
