# Working papers, newest first.
#
# Same shape as publications.yaml: id, title, year, and the optional url,
# links, comment, abstract and citation. `year` is the year the paper was
# posted, not a publication year.
#
# When a working paper is accepted, move its block to the top of
# publications.yaml, swap the preprint url for the DOI, and keep the preprint
# under `links` as "working paper version". Keep the id unchanged so any
# explainer that points at it keeps working.

- id: why-fda-withholds-drug-approval
  title: "Why FDA Withholds Drug Approval: Evidence from 443 Publicly Released Complete Response Letters"
  url: https://alextabarrok.com/papers/why-fda-withholds-drug-approval.pdf
  year: 2026
  links:
    - label: Replication data and code (ZIP)
      url: https://alextabarrok.com/research/fda-crl/complete_replication_v20260807_r20261103.zip
  abstract: >-
    This study analyzes 443 publicly released FDA Complete Response Letters covering
    333 applications. Facility inspection is the leading initial reason for
    nonapproval, accounting for 36.3 percent of applications overall and 42.2 percent
    of applications first observed from 2024 onward. Among 250 applications with two
    years of potential follow-up, another rejection is observed for 28.6 percent
    of initial facility cases, compared with 14.5 percent of other cases.
    Facility inspection remains the main reason in 28 of 33 first-to-second
    comparisons beginning with it (84.8 percent). Most facility findings concern
    inspections that occurred and found problems. The replication archive includes
    the complete study data, stored classifications, validation materials, and code.
  citation: >-
    Tabarrok, Alex. 2026. "Why FDA Withholds Drug Approval: Evidence from 443 Publicly
    Released Complete Response Letters." Working paper, November.

- id: how-much-redistribution-will-ai-require
  title: How Much Redistribution Will AI Require?
  url: https://alextabarrok.com/papers/how-much-redistribution-will-ai-require.pdf
  year: 2026
  abstract: >-
    Artificial intelligence may raise output while reducing labor’s share of income. This
    paper derives an accounting rule for the transfer required to keep aggregate real labor
    income per capita on its no-AI path. The required share of AI-path GDP depends on
    relative GDP and labor’s share. Faster growth permits a lower labor share without
    reducing aggregate labor income. Suppose real GDP per capita would otherwise grow by 2
    percent annually over ten years, with labor receiving 60 percent. No transfer is needed
    if AI raises annual growth to 5 percent and labor’s share remains at least 45 percent.
    At 10 percent growth, labor’s share can fall to approximately 28 percent and labor as a
    whole would remain as well off as under the no-AI path. A three-parameter translator
    connects beliefs about displacement, productivity, and labor’s share of new output to
    this forecast space. Across three stylized views, including one in which labor’s share
    falls to 23 percent, the required transfer remains below 6 percent of GDP. At that
    scale, making labor recipients whole while preserving gains for capital recipients
    appears politically feasible.
  citation: >-
    Tabarrok, Alex. 2026. “How Much Redistribution Will AI Require?” Working paper, September.
    [PDF](https://alextabarrok.com/papers/how-much-redistribution-will-ai-require.pdf).

- id: chaos-and-misallocation-under-price-controls
  title: Chaos and Misallocation under Price Controls
  url: https://arxiv.org/abs/2602.12066
  year: 2026
  links:
    - label: "PDF"
      url: https://briancalbrecht.com/Albrecht_Tabarrok_Whitmeyer_Price_Controls.pdf
  comment: >-
    (with Brian C. Albrecht and Mark Whitmeyer)
  abstract: >-
    Price controls kill the incentive for arbitrage. We prove a Chaos Theorem: under a binding
    price ceiling, suppliers are indifferent across destinations, so arbitrarily small cost
    differences can determine the entire allocation. The economy tips to corner outcomes in
    which some markets are fully served while others are starved; small parameter changes flip
    the identity of the corners, generating discontinuous welfare jumps. These corner
    allocations create a distinct source of cross-market misallocation, separate from the
    aggregate quantity loss (the Harberger triangle) and from within-market misallocation
    emphasized in prior work. They also create an identification problem: welfare depends on
    demand far from the observed equilibrium. We derive sharp bounds on misallocation that
    require no parametric assumptions. In an efficient allocation, shadow prices are equalized
    across markets; combined with the adding-up constraint, this collapses the
    infinite-dimensional welfare problem to a one-dimensional search over a common shadow
    price, with extremal losses achieved by piecewise-linear demand schedules. Calibrating the
    bounds to station-level AAA survey data from the 1973–74 U.S. gasoline crisis,
    misallocation losses range from roughly 1 to 9 times the Harberger triangle.
  citation: >-
    Albrecht, Brian C., Alex Tabarrok, and Mark Whitmeyer. 2026. “Chaos and Misallocation under
    Price Controls.” arXiv:2602.12066 [econ.GN].
    [https://arxiv.org/abs/2602.12066](https://arxiv.org/abs/2602.12066).

- id: private-school-competition-and-student-achievement-in-chile
  title: Private School Competition and Student Achievement in Chile
  url: https://alextabarrok.com/papers/private-school-competition-chile.pdf
  year: 2026
  abstract: >-
    Sorting pupils across private and public schools reshuffles a fixed population and cannot raise
    the population's average score. We use that fact to ask whether subsidized private schooling in
    Chile raises achievement or only sorts. Defining ten cohorts by the local market in which pupils
    started grade 4, we track over one million pupils to grade 10 wherever they enroll. Among
    markets of the same region and size, holding each pupil's grade-4 score and parents' schooling
    and income fixed, a ten-percentage-point higher cohort private share predicts 1.3 points more in
    mathematics and 0.7 more in reading. Mathematics gains arise after grade 8 and are larger where
    more pupils move into subsidized private schools on entering secondary school, with little sign
    that pupils there were pulling ahead beforehand. Admission lotteries for three cohorts show that
    attending a subsidized private secondary school raises mathematics scores by 8.1 points and has
    no statistically significant effect on reading (1.6 points). That switcher gain alone implies a
    0.8-point cohort increase per ten percentage points of private share; in the same cohorts the
    observed gain is 1.4 points, suggesting that competition also benefits pupils who do not move.
  citation: >-
    Tabarrok, Alex. 2026. “Private School Competition and Student Achievement in Chile.” Working
    paper, November.

- id: norms-in-conflict-why-ai-advisors-fail-to-improve
  title: "Norms in Conflict: Why AI Advisors Fail to Improve Human Coordination"
  url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6350778
  year: 2026
  comment: >-
    (with Zhongheng Qiao, Robertas Zubrickas and Timothy N. Cason)
  abstract: >-
    Cooperation failures in social dilemmas persist because individually rational behavior
    yields inefficient collective outcomes. Advances in AI raise two possibilities: AI may
    improve outcomes by advising humans or by acting autonomously. We test both in a repeated
    threshold public-goods experiment with heterogeneous valuations of the public good. Such
    threshold games model a broad class of burden-sharing problems (crowdfunding, shared
    infrastructure, multilateral agreements) in which efficiency requires not only coordination
    but agreement on a cost-sharing norm. We compare a human-only benchmark to treatments with
    an AI advisor (OpenAI's GPT-5) and to treatments in which AI agents make allocations
    directly. AI Only groups outperform human groups, reaching the threshold more often. The
    mechanism is illuminating: AI agents contribute near-equal amounts largely independent of
    valuations, whereas humans scale contributions with valuations. In contrast, AI advisors do
    not improve human-only outcomes. We distinguish two bottlenecks to coordination—an
    information bottleneck, in which parties lack the calculations needed to condition on
    others' behavior, and a legitimacy bottleneck, in which parties reject cost-sharing rules
    that conflict with their fairness norms. AI overcomes the first but not the second.
  citation: >-
    Qiao, Zhongheng, Alex Tabarrok, Robertas Zubrickas, and Timothy N. Cason. 2026. “Norms in
    Conflict: Why AI Advisors Fail to Improve Human Coordination.” SSRN Working Paper 6350778.
    [https://doi.org/10.2139/ssrn.6350778](https://doi.org/10.2139/ssrn.6350778).
